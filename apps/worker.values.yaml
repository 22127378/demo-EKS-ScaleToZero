# Worker: KEDA ScaledJob, one Kubernetes Job per batch of queue messages (up to 20 Jobs at once), runs on the worker
# NodePool (4 vCPU spot nodes, tainted) which keeps one node warm through its own placeholder pod.
# The image repository and the queue URL are set by scripts/deploy-apps.sh.
image:
  repository: demo-worker
  tag: 0.5.2
arch: auto
nodePool: worker            # own pool + own placeholder: warm node for Jobs, and bursts stay off the API/FE nodes
serviceAccountName: worker   # bound to an IAM role by Terraform (receive/delete on the queue)
serviceAccount:
  create: true
env:
  AWS_REGION: ap-southeast-1
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 256Mi }
ingress:
  enabled: false
scaling:
  mode: sqsjob
  sqsjob:
    region: ap-southeast-1
    messagesPerJob: 10
    max: 20
    pollingInterval: 1       # seconds between KEDA checks. DEMO setting: 1 s gives a cold start under 3 s but leaves extra empty Jobs; a real deployment should poll less often. Set here (not with --set) so a rebuilt cluster keeps it
    postgres:
      enabled: false         # proposal A (PostgreSQL trigger) is not approved, so it stays off; host and secretARN come from scripts/deploy-apps.sh
