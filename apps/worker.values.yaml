# Worker: KEDA SQS 0..20, runs on the worker NodePool (spot, taint workload=worker)
image:
  repository: busybox            # replace with .../demo-worker after PLAN.md step 6
  tag: latest
arch: auto
containerPort: 8080
command: ["sh", "-c", "sleep 3600"]
serviceAccountName: worker
nodePool: worker
ingress:
  enabled: false
scaling:
  mode: sqs
  sqs:
    queueURL: https://sqs.ap-southeast-1.amazonaws.com/000000000000/demo-jobs
    region: ap-southeast-1
