# API: KEDA HTTP, scales 0..2. ingress.host is required (the interceptor routes by Host header).
# The image repository and the database/queue addresses are set by scripts/deploy-apps.sh
# (they contain the AWS account id and resource names).
image:
  repository: demo-api
  tag: 0.3.0
arch: auto
containerPort: 8080
probe:
  httpPath: /healthz
  startup:
    enabled: false           # the Go API listens within milliseconds; a startup probe only adds delay
                             # (measured: 20 cold starts, median 2.97 s with it vs 2.06 s without)
  # Readiness stays on. Turning it off was measured too and gave no gain (median 1.93 s vs 1.88 s
  # once connection delays are excluded) while removing the safety net.
nodePool: default
serviceAccountName: api      # bound to an IAM role by Terraform (read the DB secret, send to SQS)
serviceAccount:
  create: true
env:
  AWS_REGION: ap-southeast-1
resources:
  requests: { cpu: 250m, memory: 64Mi }
  limits: { memory: 256Mi }
scaling:
  mode: http
  http: { min: 0, max: 2, scaledownPeriod: 300, targetConcurrency: 100 }
ingress:
  host: api.demo.local
  path: /
  groupOrder: 10             # evaluated before the FE catch-all rule (100)
