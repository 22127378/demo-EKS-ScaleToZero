apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: placeholder
  labels: {{- include "cc.labels" . | nindent 4 }}
value: {{ .Values.placeholder.priority }}
# Placeholders never preempt anything themselves; they only get preempted.
preemptionPolicy: Never
globalDefault: false
description: Low-priority pods that reserve capacity and are evicted by real workloads.
