{{- if eq (include "app.mode" .) "sqsjob" }}
{{- /* ScaledJob: KEDA starts one Kubernetes Job per batch of queue messages. Each Job takes at most
       messagesPerJob messages, processes them and exits (WORKER_MODE=job). */}}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "app.name" . }}-aws
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  podIdentity:
    provider: aws
{{- if and .Values.scaling.sqsjob.postgres.enabled .Values.scaling.sqsjob.postgres.host }}
{{- /* KEDA's operator reads the database password from Secrets Manager with its own IAM role (Pod Identity). */}}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "app.name" . }}-db
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  awsSecretManager:
    podIdentity:
      provider: aws
    region: {{ .Values.scaling.sqsjob.region | quote }}
    secrets:
      - parameter: userName
        name: {{ required "scaling.sqsjob.postgres.secretARN is required" .Values.scaling.sqsjob.postgres.secretARN | quote }}
        secretKey: username
      - parameter: password
        name: {{ .Values.scaling.sqsjob.postgres.secretARN | quote }}
        secretKey: password
{{- end }}
---
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: {{ include "app.name" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  pollingInterval: {{ .Values.scaling.sqsjob.pollingInterval }}
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.scaling.sqsjob.max }}
  successfulJobsHistoryLimit: {{ .Values.scaling.sqsjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.scaling.sqsjob.failedJobsHistoryLimit }}
  scalingStrategy:
    # With the SQS and the postgresql trigger both on, the larger of the two answers wins.
    multipleScalersCalculation: max
    # The SQS scaler counts messages that are already in flight, so the Jobs that hold them must be subtracted
    # ("default"). "accurate" assumes in-flight messages are not counted and would create new Jobs for the same
    # message on every poll until the first Job has picked it up.
    strategy: {{ .Values.scaling.sqsjob.strategy | quote }}
    {{- with .Values.scaling.sqsjob.pendingPodConditions }}
    # A Job whose pod does not yet meet these conditions counts as pending and is not duplicated.
    pendingPodConditions: {{- toYaml . | nindent 6 }}
    {{- end }}
  jobTargetRef:
    parallelism: 1
    completions: 1
    # A message that fails is not deleted and comes back through SQS, so a failed Job is not retried here.
    backoffLimit: 0
    activeDeadlineSeconds: {{ .Values.scaling.sqsjob.activeDeadlineSeconds }}
    ttlSecondsAfterFinished: {{ .Values.scaling.sqsjob.ttlSecondsAfterFinished }}
    template:
      metadata:
        labels: {{- include "app.labels" . | nindent 10 }}
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
        {{- with .Values.serviceAccountName }}
        serviceAccountName: {{ . }}
        {{- end }}
        {{- with .Values.imagePullSecrets }}
        imagePullSecrets: {{- toYaml . | nindent 10 }}
        {{- end }}
        nodeSelector:
          nodepool: {{ .Values.nodePool }}
          {{- if ne .Values.arch "auto" }}
          kubernetes.io/arch: {{ .Values.arch }}
          {{- end }}
        {{- if eq .Values.nodePool "worker" }}
        tolerations:
          - key: workload
            operator: Equal
            value: worker
            effect: NoSchedule
        {{- end }}
        containers:
          - name: app
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            {{- with .Values.command }}
            command: {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.args }}
            args: {{- toYaml . | nindent 14 }}
            {{- end }}
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: WORKER_MODE
                value: "job"
              - name: JOB_BATCH
                value: {{ .Values.scaling.sqsjob.messagesPerJob | quote }}
              - name: JOB_WAIT_SECONDS
                value: {{ .Values.scaling.sqsjob.receiveWaitSeconds | quote }}
              {{- range $k, $v := .Values.env }}
              - name: {{ $k }}
                value: {{ $v | quote }}
              {{- end }}
            {{- with .Values.envFrom }}
            envFrom: {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.securityContext }}
            securityContext: {{- toYaml . | nindent 14 }}
            {{- end }}
            resources: {{- toYaml .Values.resources | nindent 14 }}
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: {{ include "app.name" . }}-aws
      metadata:
        queueURL: {{ required "scaling.sqsjob.queueURL is required" .Values.scaling.sqsjob.queueURL | quote }}
        queueLength: {{ .Values.scaling.sqsjob.messagesPerJob | quote }}
        awsRegion: {{ .Values.scaling.sqsjob.region | quote }}
        identityOwner: operator
        scaleOnInFlight: {{ .Values.scaling.sqsjob.scaleOnInFlight | quote }}
{{- if and .Values.scaling.sqsjob.postgres.enabled .Values.scaling.sqsjob.postgres.host }}
    # Queued screenings counted in the database: always fresh, unlike the SQS queue length, which lags by about
    # 6 seconds when it is polled every second. The Job still takes its messages from SQS.
    - type: postgresql
      authenticationRef:
        name: {{ include "app.name" . }}-db
      metadata:
        host: {{ .Values.scaling.sqsjob.postgres.host | quote }}
        port: {{ .Values.scaling.sqsjob.postgres.port | quote }}
        dbName: {{ .Values.scaling.sqsjob.postgres.dbName | quote }}
        sslmode: {{ .Values.scaling.sqsjob.postgres.sslmode | quote }}
        query: {{ .Values.scaling.sqsjob.postgres.query | quote }}
        targetQueryValue: {{ .Values.scaling.sqsjob.messagesPerJob | quote }}
        activationTargetQueryValue: "0"
{{- end }}
{{- end }}
