{{- if and .Values.serviceAccountName .Values.serviceAccount.create }}
{{- /* EKS Pod Identity binds IAM roles to a service account by name, so the account must exist */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  labels: {{- include "app.labels" . | nindent 4 }}
{{- end }}
