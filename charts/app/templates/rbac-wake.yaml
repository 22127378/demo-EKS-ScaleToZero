{{- if .Values.wake.enabled }}
{{- /* Lets the app start worker Jobs itself right after it queues a message. Narrow on purpose: it can create and
       list Jobs and read one ScaledJob in this namespace, nothing else. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.name" . }}-wake
  labels: {{- include "app.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledjobs"]
    resourceNames: [{{ .Values.wake.scaledJob | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.name" . }}-wake
  labels: {{- include "app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ required "serviceAccountName is required when wake.enabled" .Values.serviceAccountName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.name" . }}-wake
{{- end }}
