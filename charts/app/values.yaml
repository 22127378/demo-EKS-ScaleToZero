# ---- Edit only these fields to plug in any image ----
image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# auto = no constraint (only for multi-arch images). amd64 | arm64 = pin the architecture.
# Run scripts/detect-arch.sh <image:tag> to find the right value.
arch: auto

containerPort: 80
command: []        # override ENTRYPOINT
args: []           # override CMD
env: {}            # KEY: value
envFrom: []        # - secretRef: {name: x}
serviceAccountName: ""   # used for Pod Identity (e.g. the api sending to SQS)
serviceAccount:
  create: false          # true = the chart creates serviceAccountName (needed when nothing else does)
securityContext: {}      # nothing enforced by default so unfamiliar images do not break

# Probe: TCP by default (works with any image). Set httpPath to use HTTP instead.
# The readiness probe runs every second so a new pod joins the endpoints as early as possible
# (this was a 5 s period, which alone could add up to 5 s to a cold start).
probe:
  httpPath: ""     # e.g. /healthz
  # Readiness gates traffic until the app answers. Disabling it makes a pod Ready as soon as its
  # container starts, which saves the probe's own delay (kubelet adds up to ~1 s of jitter plus
  # one period) but removes that safety net: only turn it off for apps that bind their port within
  # milliseconds and sit behind a retrying proxy such as the KEDA interceptor.
  readiness:
    enabled: true
  initialDelaySeconds: 0
  periodSeconds: 1
  # The startup probe holds liveness/readiness back until the app first answers, and gives
  # slow-starting images up to failureThreshold * periodSeconds to do so.
  # It runs BEFORE the readiness probe, so with both at 1 s a pod can wait up to ~1 s longer to
  # become Ready. Turn it off (enabled: false) for apps that start in milliseconds; keep it for
  # unfamiliar images that may start slowly.
  startup:
    enabled: true
    periodSeconds: 1
    failureThreshold: 30

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 512Mi }

# Only used when scaling.mode = none
replicas: 1

# default (spot) or worker (spot, tainted workload=worker)
nodePool: default

service:
  port: 80

# ALB ingress. Several apps share one ALB through group.name
ingress:
  enabled: true
  className: alb
  groupName: demo
  scheme: internet-facing
  host: ""            # REQUIRED when scaling.mode = http
  path: /
  pathType: Prefix
  healthcheckPath: "" # defaults to probe.httpPath, or "/"
  # ALB health check. 5 s is the shortest interval the ALB allows; a new pod receives traffic
  # after healthyThreshold passed checks (about interval * healthyThreshold seconds).
  healthcheck:
    intervalSeconds: 5
    timeoutSeconds: 2
    healthyThreshold: 2
    unhealthyThreshold: 2
  certificateArn: ""  # if set -> enable HTTPS 443 + redirect 80
  # Comma-separated CIDRs allowed to reach the ALB (e.g. "203.0.113.10/32"). Empty = open to the
  # internet. All ingresses of one ALB group should use the same value.
  inboundCidrs: ""
  # Order of this ingress's rules inside the shared ALB (lower is evaluated first). Give host-specific
  # ingresses a lower number than a catch-all one: an ingress with no host matches every request, so
  # if it comes first it hides all the others. 0 = not set (the controller falls back to its default).
  groupOrder: 0
  annotations: {}

# Pick exactly ONE scaling controller:
#   none : fixed .replicas
#   hpa  : HPA on CPU
#   http : KEDA HTTP Add-on (scales to zero, ingress goes through the interceptor)
#   sqs  : KEDA on SQS queue length
scaling:
  mode: hpa
  hpa:
    min: 1
    max: 2
    cpu: 50
    scaleUpPods: 1              # pods added per scaleUpPeriodSeconds; no stabilization wait on the way up
    scaleUpPeriodSeconds: 15
    scaleDownStabilizationSeconds: 300
  http:
    min: 0
    max: 2
    scaledownPeriod: 300        # seconds without requests before scaling to zero
    targetConcurrency: 100      # concurrent requests per pod (high: a Go pod handles many and max is 2 pods)
    # How long the interceptor holds a request while waiting for a pod. Write it in Go's normalized
    # duration form (2m0s, not 120s): the KEDA HTTP operator rewrites the field in that form and
    # Helm then reports a field-ownership conflict on every upgrade.
    requestTimeout: 2m0s
    interceptorNamespace: keda
    interceptorService: keda-add-ons-http-interceptor-proxy
    interceptorPort: 8080
    # Also scale on CPU (needs resources.requests.cpu). The HTTP add-on alone sees only request concurrency.
    cpu:
      enabled: false
      utilization: 70           # percent of the CPU request, averaged over the pods
    externalScalerAddress: keda-add-ons-http-external-scaler.keda:9090
  # KEDA ScaledJob: one Kubernetes Job per batch of messages (scaling.mode = sqsjob). The Job ends when its batch is done.
  sqsjob:
    queueURL: ""
    region: ap-southeast-1
    messagesPerJob: 5           # messages one Job takes; also the queueLength target KEDA divides the queue by
    max: 20                     # Jobs running at once
    strategy: default           # default | accurate | eager; see the comment in templates/scaledjob-sqs.yaml
    scaleOnInFlight: true       # false = count only visible messages (those a Job has not taken yet)
    pendingPodConditions: []    # e.g. [Ready]: Jobs whose pod is not Ready yet count as pending
    pollingInterval: 1          # seconds between queue checks
    receiveWaitSeconds: 2       # how long a Job waits for messages before it gives up and exits
    activeDeadlineSeconds: 300  # a Job running longer than this is killed
    ttlSecondsAfterFinished: 120
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 5
    # Second trigger: count queued screenings in the database (see templates/scaledjob-sqs.yaml). Off unless host is set.
    postgres:
      enabled: false
      host: ""                  # Aurora cluster endpoint (scripts/deploy-apps.sh fills it in)
      port: 5432
      dbName: demo
      sslmode: require
      secretARN: ""             # Secrets Manager secret with the database user and password (deploy-apps.sh fills it in)
      # Only rows queued in the last 5 minutes count: a row whose message was lost (or whose worker died) must not
      # start empty Jobs forever. Measured without the window: 3 orphan rows started 7 empty Jobs in 3.5 minutes.
      query: "SELECT count(*) FROM applications WHERE screening_status = 'queued' AND screening_requested_at > now() - interval '5 minutes'"
  sqs:
    queueURL: ""
    region: ap-southeast-1
    queueLength: "5"
    min: 0
    max: 20
    pollingInterval: 5          # seconds between SQS queue-length checks (also the worker's start-up latency)
    cooldownPeriod: 60
    # Also scale on CPU (needs resources.requests.cpu); keeps scale-to-zero because the queue trigger still wakes the worker.
    cpu:
      enabled: false
      utilization: 70

pdb:
  enabled: true

terminationGracePeriodSeconds: 30
