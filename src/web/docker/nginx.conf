server {
  listen 80;
  root /usr/share/nginx/html;

  # Generated by 40-config.sh at container start; empty unless UPSTREAM is set.
  include /etc/nginx/api-proxy.conf;

  # Runtime config must never be cached, otherwise a new API address is not picked up.
  location = /config.json {
    add_header Cache-Control "no-store";
  }

  # Single-page app fallback.
  location / {
    try_files $uri /index.html;
  }
}
