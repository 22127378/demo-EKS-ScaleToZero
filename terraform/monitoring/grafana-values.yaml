# Grafana is only reachable inside the cluster (ClusterIP); use kubectl port-forward from your machine.
# The admin password is generated by the chart into the "grafana" secret in the monitoring namespace.
nodeSelector:
  node-role: system
service:
  type: ClusterIP
persistence:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc:3100
        access: proxy
