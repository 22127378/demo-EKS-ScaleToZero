# One Alloy replica that turns Kubernetes events (pod scheduled, killed, HPA rescale...) into log lines.
# Kubernetes itself only keeps events for about an hour.
controller:
  type: deployment
  replicas: 1
  nodeSelector:
    node-role: system

alloy:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 192Mi }
  configMap:
    content: |
      loki.source.kubernetes_events "events" {
        log_format = "logfmt"
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
